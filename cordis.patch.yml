# dsh-acp-v1 bundle patch: the interactive ACP (Agent Client
# Protocol) v1 surface for the DeepSeek Harness, applied as ONE insert over a
# profile rooted on @deepseek-ai/dsh-base (which owns llm/session/agents/
# sandbox/tools/commands/persistence rows...). The bridge itself is exported by
# this package's main entry (lib/src/bridge/index.js), so the row name is the
# package name; the loader resolves it from the profile's module graph.
#
# Patch semantics: a top-level {id, config} op REPLACES that row's whole
# config; `- insert:` adds new rows. Mapping rationale: docs/design.zh.md.
#
# The agent plane: dsh 0.2.0-rc.2 moved agent-preset declarations out of a
# rooted package into ordinary plugin rows. dsh-base keeps its agent rows for
# the single-session TUI, so this surface disables them below and every session
# mounts one of the `presets/*.patch.yml` declarations instead — the same
# split @deepseek-ai/dsh-web-app 0.2.0-rc.2 performs, minus its browser rows.

# ── persona: ACP sessions get their own concise coding persona ─────────────
# dsh 0.1.5-rc.1 split the deployment persona into a prefix (before first-party
# guidance) and a suffix (after it); the former single `persona` key is gone
# from the system-prompt schema, so the identity sentence and the environment
# notes must ride the two new keys — the same shape @deepseek-ai/dsh-acp-app
# ships in this cohort.
- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding assistant powered by the {{model}} model.
    personaSuffix: >-
      Your working directory is {{cwd}}. Your bash tool runs under a file
      sandbox — a `[sandbox: file access denied …]` result is policy, not a
      command bug. Verify your work by running the code or tests. Keep answers
      brief and factual.

# No HMR under an ACP stdio session: a reload would tear the wire down.
- id: hmr
  disabled: true

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for the TUI, which is single-session and composes its agent process-wide; this
# surface disables them here and lets each session mount a preset instead.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone reorders
# the composition.

# `shell-env` STAYS in the host plane: it injects shell variables before any
# session exists, and a host row that injects a service is the criterion for
# host-plane ownership — behind a preset realm those variables would never
# reach the model's shell at all.


- id: tool-plugin-manager
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane; only the model-facing
# `job_*` controls move. Its producers — `tool-bash` here, `tool-terminal` and a
# non-continuable `tool-subagent` elsewhere — are preset rows that resolve it
# with `ctx.get`, and an entry-local realm around the registry is invisible to
# every sibling row outside that realm, so `run_in_background` answered
# "background jobs unavailable" while the controls sat in the catalog. That is
# the `goals` criterion read from inside the preset: a Service a row outside its
# realm READS belongs to the plane both can see. The registry is keyed by owning
# agent, so one host instance serves every session exactly as before presets.

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

# The `skill` REGISTRY stays in the host plane. It is host+per-scope layered
# (the tools-registry shape): deployment-level providers — repository plugins,
# a host skill-filesystem row — register into its global layer, while a preset's
# `skill-filesystem` registers into that preset's layer, and each agent reads the
# merged catalog its scope chain selects. Only the per-agent rows move behind
# presets: the base host `skill-filesystem` row is disabled here (presets own local
# discovery), and `tool-skill` is what a preset mounts to give its agent the
# catalog and loader at all.

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# The goal service and session driver stay on the host plane, where Gateway
# remotes resolve them. Presets own the human command and model-facing tool.

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

# The token METER stays on the host plane; only the compaction backend that
# reads it moves. It owns the context-meter projection units, and that table is
# process-wide, so preset ownership would make the meter a function of which
# presets happen to be mounted rather than a per-session fact. Same criterion as
# `tasks` and `goals`; the reasoning has one home in
# (host-plane ownership after presets).

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The subagent registry and its backends STAY in the host plane. `subagents` is
# a process singleton with a cross-session query surface (`listChildren`,
# `followup`) that the host api-proxy serves to the browser, and a provider
# registers under a globally unique name, so a per-session copy would both
# starve that host row and collide on the second session. What a preset
# chooses is which delegation TOOLS its agent sees, below.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

# `base` ships this row disabled; the preset-plane gate reads declared row ids
# without regard to `disabled`, so this row must stay to keep `tool-ralph` off
# the host plane and out of collision with every preset's row.
- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset selection registry. The shipped preset declarations follow as
# separate patch files under `presets/`, listed after this file in
# `package.json` `dsh.bundle.patch`.
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    # Subagent model selection needs this Host-scope seat when a shipped
    # preset mounts on a base-only profile (the official web-app bundle carries
    # it; dsh-base does not).
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # The ACP bridge plugin: opens the AgentSideConnection over stdin/stdout
    # once the tree settles and drives ctx.agents sessions. provider/model are
    # the shipped route defaults, overridable by the bridge from
    # DSH_ACP_PROVIDER / DSH_ACP_MODEL at boot (restart to change); clients
    # may still switch per session through configOptions.
    - id: dsh-acp-v1
      name: 'dsh-acp-v1'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

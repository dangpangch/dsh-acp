# dsh-acp-v1 bundle patch: the interactive ACP (Agent Client
# Protocol) v1 surface for the DeepSeek Harness, applied as ONE insert over a
# profile rooted on @deepseek-ai/dsh-base (which owns llm/session/agents/
# sandbox/tools/commands/persistence rows...). The bridge itself is exported by
# this package's main entry (lib/src/bridge/index.js), so the row name is the
# package name; the loader resolves it from the profile's module graph.
#
# Patch semantics: a top-level {id, config} op REPLACES that row's whole
# config; `- insert:` adds new rows. Mapping rationale: docs/design.zh.md.

# ── persona: ACP sessions get their own concise coding persona ─────────────
# dsh 0.1.5-rc.1 split the deployment persona into a prefix (before first-party
# guidance) and a suffix (after it); the former single `persona` key is gone
# from the system-prompt schema, so the identity sentence and the environment
# notes must ride the two new keys — the same shape @deepseek-ai/dsh-acp-app
# ships in this cohort.
- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding assistant powered by the {{model}} model.
    personaSuffix: >-
      Your working directory is {{cwd}}. Your bash tool runs under a file
      sandbox — a `[sandbox: file access denied …]` result is policy, not a
      command bug. Verify your work by running the code or tests. Keep answers
      brief and factual.

# No HMR under an ACP stdio session: a reload would tear the wire down.
- id: hmr
  disabled: true

- insert:
    # Per-session agent-preset roster. `default` names the preset every ACP
    # agent is composed from (plain native-tool coding agent); a deployment
    # override is read by the BRIDGE from DSH_ACP_PRESET at session creation
    # (restart to change, see README "Presets & model route"). The dsh CLI
    # profile boot appends the shipped preset root (and the home user root is
    # derived) onto this row automatically; a standalone dev boot must supply
    # its own roots (see src/dev-bin.ts).
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # Subagent model selection needs this Host-scope seat when the shipped
    # `standard` preset mounts on a base-only profile (the official web-app
    # bundle carries it; dsh-base does not).
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # The ACP bridge plugin: opens the AgentSideConnection over stdin/stdout
    # once the tree settles and drives ctx.agents sessions. provider/model are
    # the shipped route defaults, overridable by the bridge from
    # DSH_ACP_PROVIDER / DSH_ACP_MODEL at boot (restart to change); clients
    # may still switch per session through configOptions.
    - id: dsh-acp-v1
      name: 'dsh-acp-v1'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash
